<html>
  <head>
    <link rel="stylesheet" type="text/css" href="ove.css" />
  </head>
  <body style="display: flex">
    <script type="text/javascript" src="index.umd.js"></script>
    <style>
      .ove-created-div {
        width: 100%;
        height: 100%;
        background-color: white;
      }
      .save-button {
        display: inline-block;
        padding: 10px;
        background-color: #0078d4;
        color: white;
        text-decoration: none;
        border-radius: 4px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-size: 16px;
        font-weight: 600;
        box-shadow: none;
        border: none;
        cursor: pointer;
        position: fixed;
        top: 10px;
        right: 35px;
        z-index: 20000;
      }
      .save-button:hover {
        background-color: #005a9e; /* 더 어두운 파란색으로 변화 */
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* 그림자 효과 */
      }
      .save-button:disabled {
        background-color: gray;
        cursor: not-allowed;
        opacity: 0.6;
      }
    </style>
    <button id="save-button" class="save-button" onclick="postSave()">
      SAVE
    </button>
    <script type="text/javascript">
      function isSavable() {
        document.getElementById("save-button").disabled = true;
      }
      isSavable();

      function postSave() {
        console.log("postSave called");
      }
      const editor = window.createVectorEditor("createDomNodeForMe", {
        withPreviewMode: false,
        editorName: "FirstSequence",
        showMenuBar: true,
      });
      /* createDomNodeForMe will make a dom node for you and append it to the document.body*/
      editor.updateEditor({
        sequenceData: {
          circular: true,
          sequence:
          "ATGC",
        },
        showReadOnly: false,
      });
      window.debugEditor = editor; // For debugging purposes
    </script>
  </body>
</html>
